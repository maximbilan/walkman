name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build walkman.c
        run: cc walkman.c -o walkman -lm
      - name: Build the readable version
        run: cc walkman.readable.c -o walkman-readable -lm
      - name: The bot plays 20 levels for 90 seconds each
        run: |
          cc -DDEV walkman.readable.c -o walkman-dev -lm
          ./walkman-dev --test 5400 20 | tee test.txt
          grep -q '^0 of 20 seeds died' test.txt
